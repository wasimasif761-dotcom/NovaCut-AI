name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Prepare Keystore & Environment Configuration
        run: |
          # 1. Restore or generate debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64"
          fi
          
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo "Initialized .env file"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            -Djava.awt.headless=true

      - name: Verify APK Generation
        run: |
          echo "Listing generated APKs:"
          ls -la app/build/outputs/apk/debug/
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Error: app-debug.apk was not generated!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaCut-AI-v${{ github.run_number }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
